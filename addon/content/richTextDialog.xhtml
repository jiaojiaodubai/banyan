<?xml version="1.0" encoding="utf-8"?>
<html
  id="banyan-rich-text-dialog"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  resizable="true"
>
  <head>
    <title data-l10n-id="richtext-dialog-title"></title>
    <link rel="localization" href="zotero.ftl" />
    <link rel="localization" href="__addonRef__-richTextEditor.ftl" />

    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/zotero.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/overlay.css" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/dialogFooter.css"
    />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/richTextEditor.css"
    />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/richTextDialog.css"
    />

    <script src="chrome://zotero/content/include.js"></script>
    <script src="chrome://zotero/content/customElements.js"></script>
    <script>
      const addon = Zotero.__addonInstance__;
      const ztoolkit = addon.data.ztoolkit;
    </script>
    <script src="chrome://__addonRef__/content/scripts/richTextDialog.js"></script>
  </head>

  <body>
    <!-- The window is the editor's frame: the toolbar and the text area fill
         it edge to edge, and the footer below is the shared dialog footer. -->
    <main id="rich-text-editor"></main>
    <footer class="dialog-footer">
      <button
        id="cancel-button"
        type="button"
        data-l10n-id="richtext-dialog-cancel"
      ></button>
      <button
        id="accept-button"
        type="button"
        data-l10n-id="richtext-dialog-confirm"
        default="true"
      ></button>
    </footer>
  </body>
</html>
