name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build integration add-ins
        run: pnpm run integrations:build

      - name: Install Zotero beta
        uses: ./.github/actions/setup-zotero

      - name: Test development
        run: xvfb-run -a pnpm test:dev
        env:
          ZOTERO_SETUP_COMPLETE: "1"

      - name: Build
        run: |
          pnpm run build

      - name: Test production XPI
        run: xvfb-run -a pnpm test:prod

      - name: Release to GitHub
        run: |
          # Tags are re-issued while a beta line is rebuilt, and the scaffold
          # always creates a release, so drop the previous release first. The
          # git tag itself stays: GitHub accepts creating a release for an
          # existing tag.
          pnpm verify:prod
          gh release delete "$GITHUB_REF_NAME" --yes || true
          pnpm run release
        env:
          GH_TOKEN: ${{ secrets.GitHub_TOKEN }}

      - name: Upload production test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-smoke-log
          path: .scaffold/prod-smoke.log
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Notify release
        uses: apexskier/github-release-commenter@v1
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :rocket: _This ticket has been resolved in {release_tag}. See {release_link} for release notes._
