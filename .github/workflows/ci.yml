name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run Lint
        run: pnpm run lint:check

  build:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build integration add-ins
        run: pnpm run integrations:build
      - name: Run Build
        run: pnpm run build
      - name: Install Zotero beta
        uses: ./.github/actions/setup-zotero
      - name: Test production XPI
        run: xvfb-run -a pnpm test:prod
      - name: Upload production test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-production-smoke-log
          path: .scaffold/prod-smoke.log
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build
          include-hidden-files: true

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run integrations:build
      - uses: ./.github/actions/setup-zotero
      - run: xvfb-run -a pnpm test --no-watch
        env:
          ZOTERO_SETUP_COMPLETE: "1"
      - name: Run Node tests (style lint)
        run: pnpm run test:node
